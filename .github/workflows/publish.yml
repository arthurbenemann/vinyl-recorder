name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Default to least privilege; the publish job opts into `packages: write`.
permissions:
  contents: read

jobs:
  # Gate the publish on CI passing for the SAME tagged commit. A tag that
  # races a broken main no longer ships an image — instead the publish job
  # is skipped with a clear "CI did not succeed" message in the run summary.
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find CI run for this tag's commit
        # Look up the CI workflow run for this exact SHA. If it's not
        # `success`, fail the gate so `publish` is skipped.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          # Allow up to 30 min for CI to land if a developer pushed the tag
          # and the commit at roughly the same moment.
          for i in $(seq 1 60); do
            run_json=$(gh run list \
              --workflow=ci.yml \
              --commit "$SHA" \
              --limit 1 \
              --json status,conclusion 2>/dev/null || echo '[]')
            status=$(echo "$run_json" | jq -r '.[0].status // ""')
            concl=$(echo "$run_json" | jq -r '.[0].conclusion // ""')
            echo "attempt $i: status=$status conclusion=$concl"
            if [ "$status" = "completed" ]; then
              if [ "$concl" = "success" ]; then
                echo "CI succeeded for $SHA"
                exit 0
              else
                echo "CI did not succeed (conclusion=$concl) — refusing to publish"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "CI did not complete within 30 min — refusing to publish"
          exit 1

  publish:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile's version stage runs `git describe` against the
          # copied .git, so it needs full history + tags.
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The natural deployment includes Pi-class hosts, where the
          # recorder may run alongside the capture service. Multi-arch
          # publish lets `docker compose pull` Just Work on arm64 too.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

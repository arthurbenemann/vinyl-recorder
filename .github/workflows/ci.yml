name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app pi tests

      - name: Syntax check
        run: python -m compileall -q app pi tests

  tests:
    name: Unit + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        # Pinned to the same shape the runtime image installs (FastAPI +
        # uvicorn) plus pytest tooling. httpx is what TestClient uses
        # internally; pytest-cov publishes a coverage report at the end.
        run: pip install pytest pytest-cov fastapi "uvicorn[standard]" httpx

      - name: Run unit + API tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vinyl-recorder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet

  e2e:
    name: E2E (compose + record from /loop)
    runs-on: ubuntu-latest
    # The e2e job exercises the full ffmpeg pipeline through real containers,
    # so it needs the docker socket and ffprobe. Builds both images, brings
    # the stack up via the test-streams overlay, records a 5 s clip, and
    # asserts the resulting FLAC. ~2 min wall time.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + test deps
        # ffmpeg is needed for the ffprobe assertion at the end of the e2e
        # test (verifying the captured FLAC's format). pytest-playwright
        # drives the headless-chromium frontend smoke tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install pytest pytest-playwright

      - name: Install playwright browsers
        # `--with-deps` pulls in the system libs chromium needs on Ubuntu —
        # ~150 MB once cached.
        run: playwright install --with-deps chromium

      - name: Pre-pull base image
        # Speeds up `docker compose build` slightly and surfaces registry
        # auth issues before pytest swallows them in subprocess output.
        run: docker pull ubuntu:24.04

      - name: Pre-build stack
        # Build explicitly here (separate step) so any Dockerfile / compose
        # error surfaces in its own log lane rather than getting buried in
        # pytest's subprocess capture. The fixture's `compose up` picks up
        # the just-built images.
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml build

      - name: Run e2e tests
        # Scope to tests/e2e/ only — the unit + api modules import fastapi /
        # pydantic which aren't installed in this job, and pytest's `-m e2e`
        # filter deselects them but still imports them at collection time.
        run: pytest tests/e2e -m e2e -v -s

      - name: Dump container state on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps -a || true
          echo "=== docker compose logs ==="
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color || true
          echo "=== docker ps -a ==="
          docker ps -a || true

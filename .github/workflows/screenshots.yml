name: Screenshots

# Refreshes images/*.png on push to main (post-merge) when the UI or the
# screenshot tooling has changed. Per-PR previews were dropped: PNGs are
# binary and can't be 3-way merged, so committing them back to PR branches
# made every UI PR conflict with every other UI PR. The post-merge run on
# main is the canonical place that needs the in-tree PNGs to stay current
# with the README — that's all this workflow does now.

on:
  push:
    branches: [main]
    paths:
      - "app/static/**"
      - "app/main.py"
      - "app/routes/**"
      - "app/templates/**"
      - "tools/screenshots.py"
      - "tools/seed_demo_data.py"
      - "docker-compose*.yml"
      - "test-streams/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

# Cancel an in-flight run when a newer push lands on the same ref. A stale
# screenshot run is wasted compute — the next one will overwrite its
# output anyway.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

# Default the workflow to read-only; the `regenerate` job opts into
# `contents: write` for the commit-back step. Mirrors ci.yml's posture.
permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate UI screenshots
    runs-on: ubuntu-latest
    # Job-level write permission so the commit-back step can push refreshed
    # PNGs to main on the post-merge push event. PR runs never push to a
    # branch (see the conditional on the commit step) — they only upload
    # an artifact and post a preview comment.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit-back can fast-forward against
          # the remote main tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: docker/setup-buildx-action@v3

      - name: Cache Playwright browsers
        # Mirrors ci.yml's e2e job: chromium + Linux deps are ~150 MB and
        # cache across runs so `playwright install` is near-no-op on warm
        # runners. Key on this workflow file's hash so a deliberate browser
        # version bump invalidates.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/screenshots.yml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright + Python deps
        # `screenshots` group in pyproject.toml: `playwright` drives the
        # screenshot capture; `Pillow` powers the perceptual-diff gate
        # (tools/compare_screenshots.py). Neither is a runtime app dep,
        # which is why they live in their own group rather than `runtime`.
        run: |
          pip install --group screenshots
          playwright install --with-deps chromium

      - name: Build stack with layer cache
        # Same bake-action pattern as ci.yml's e2e job — pulls/pushes
        # layer cache to GHA Cache (separate scope to avoid stomping
        # ci.yml's). The screenshots job uses the dev+test overlay so the
        # recorder builds from the PR's checkout (not the published
        # image) and the synthetic test-streams source comes up alongside.
        uses: docker/bake-action@v6
        with:
          files: |
            docker-compose.yml
            docker-compose.dev.yml
            docker-compose.test.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=screenshots
            *.cache-to=type=gha,scope=screenshots,mode=max

      - name: Bring up the stack
        # `--wait` blocks until each service's healthcheck flips to
        # healthy — same readiness contract the e2e fixture uses, so by
        # the time this returns FastAPI is serving /health and the
        # synthetic stream is reachable from the recorder.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            -f docker-compose.test.yml \
            up -d --wait

      - name: Wait for /health
        # Belt-and-braces: --wait already gates on the Dockerfile's
        # HEALTHCHECK, but if a future change drops that we still want
        # the screenshot job to fail loudly with a clear error rather
        # than racing the FastAPI lifespan.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "recorder healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "recorder /health never responded"
          exit 1

      - name: Seed demo data
        # Copy tools/ into the running container then exec the seed script
        # there — the runtime Dockerfile only ships /app, so tools/ isn't
        # baked in. Running inside the container guarantees the same Python
        # runtime + modules the app uses, and /output is bind-mounted to
        # ./output on the host so the live app picks the seeded files up
        # via its normal directory scans. The script accepts --output-dir
        # per the contract with the parallel worker writing tools/.
        run: |
          docker cp tools/. vinyl-recorder:/app/tools/
          docker exec vinyl-recorder \
            python /app/tools/seed_demo_data.py --output-dir /output

      - name: Capture screenshots
        # The script drives a headless chromium against the live recorder
        # and writes images/library.png, images/album-combine.png,
        # images/split-editor.png. Selector mismatches (UI changed,
        # script not updated) bubble up as a non-zero exit and fail the
        # workflow — that's the whole point of this job.
        run: |
          python tools/screenshots.py \
            --url http://127.0.0.1:8080 \
            --output-dir ./images

      - name: Detect visible changes
        id: diff
        # Perceptual diff against HEAD instead of byte-equality. PNG
        # encoder timing + chromium sub-pixel rendering produce small
        # byte differences even when the visible UI is identical, which
        # would otherwise spam the PR with no-op refresh commits. The
        # script writes `changed=true|false` to stdout per the threshold;
        # piping that into $GITHUB_OUTPUT carries the verdict to the
        # commit-back step's `if:` condition.
        run: |
          python tools/compare_screenshots.py --directory images >> "$GITHUB_OUTPUT"

      - name: Upload screenshots artifact
        # Always upload — the artifact is the only way for PR reviewers
        # to see the regenerated PNGs before merge (we no longer commit
        # back to PR branches). Visible from the PR's Checks tab.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: images/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit refreshed screenshots
        # Only the post-merge push to main commits back. PR runs are
        # deliberately excluded: committing PNGs (binary, unmergeable)
        # to PR branches makes every UI PR conflict with every other
        # UI PR on `images/*.png` the moment one of them merges. The
        # `[skip-changelog]` marker keeps these auto-commits out of the
        # generated changelog (git-cliff filters on commit message
        # conventions, see CONTRIBUTING.md).
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "chore(screenshots): refresh UI screenshots [skip-changelog]"
          git push


      - name: Dump container state on failure
        # Mirrors ci.yml's e2e job. If `tools/screenshots.py` exits
        # non-zero (selector not found because UI changed, page never
        # loaded, etc.) the most useful diagnostic is the recorder's
        # logs at the moment of capture — surface them inline so the
        # failing run is debuggable without re-running locally.
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            -f docker-compose.test.yml \
            ps -a || true
          echo "=== docker compose logs ==="
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            -f docker-compose.test.yml \
            logs --no-color || true
          echo "=== docker ps -a ==="
          docker ps -a || true

      - name: Tear down stack
        # Always run so a failed screenshot capture doesn't leave the
        # stack + bind-mounted ./output around on the runner (it's
        # ephemeral, but `down -v` also removes the named volumes a
        # future re-run would otherwise inherit).
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            -f docker-compose.test.yml \
            down -v || true

services:
  vinyl-recorder:
    # Pulls the pre-built image published on every tag by .github/workflows/publish.yml.
    # For local development (build from source) layer docker-compose.dev.yml on top —
    # `make` already does this.
    image: ghcr.io/arthurbenemann/vinyl-recorder:latest
    container_name: vinyl-recorder
    ports:
      - "8080:8080"
    volumes:
      - ./output:/output
      # Inherit host timezone so recording filenames and the FLAC `date`
      # tag (datetime.now() in routes/recordings.py) match local wallclock
      # instead of the image's UTC default.
      - /etc/localtime:/etc/localtime:ro
    # Every runtime option has a sensible default baked into app/state.py.
    # To override (most commonly DEFAULT_STREAM_URL — your Pi or other audio
    # source), copy .env.example → .env next to this file and uncomment what
    # you want. Compose loads it automatically; restart the container to apply.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

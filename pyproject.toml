[project]
name = "vinyl-recorder"
version = "0.9.1"
description = "Web UI for capturing an HTTP audio stream as tagged FLAC, with MusicBrainz/Discogs lookup and Jellyfin-ready output."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "Arthur Benemann" }]
keywords = ["vinyl", "flac", "musicbrainz", "discogs", "jellyfin", "audio", "recording"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]

[project.urls]
Homepage = "https://github.com/arthurbenemann/vinyl-recorder"
Repository = "https://github.com/arthurbenemann/vinyl-recorder"
Issues = "https://github.com/arthurbenemann/vinyl-recorder/issues"
Changelog = "https://github.com/arthurbenemann/vinyl-recorder/blob/main/CHANGELOG.md"

# PEP 735 dependency groups — single source of truth for what gets pip-
# installed into the runtime image and each CI job. Refer to a group from
# the Dockerfile / a workflow with `pip install --group <name>`; bump a
# pin here and every consumer picks it up. `runtime` is also included
# into `test` so the unit/API job exercises the same FastAPI/uvicorn
# stack the image ships.
[dependency-groups]
runtime = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "python-multipart==0.0.29",
    "paramiko==5.0.0",
    "audioop-lts==0.2.2",
    "Pillow==12.2.0",
]
test = [
    {include-group = "runtime"},
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
]
e2e = [
    "pytest==9.0.3",
    "pytest-playwright==0.8.0",
    "Pillow==12.2.0",
]
screenshots = [
    "playwright==1.60.0",
    "Pillow==12.2.0",
]
lint = [
    "ruff==0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run skips e2e — those need a docker daemon and ~2 min. CI's
# dedicated e2e job overrides with `-m e2e` to actually run them.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not e2e",
]
markers = [
    "e2e: end-to-end tests that boot the full docker compose stack (slow, ~2 min)",
]
# Hard cap per test so a hung subprocess / blocked WS handler doesn't burn
# through the GHA budget. e2e overrides this with its own marker-scoped
# higher cap when run by the CI e2e job.
timeout = 60
# Treat all DeprecationWarnings from first-party code as errors so an MB /
# Pydantic / FastAPI deprecation surfaces in CI rather than rotting in
# place. Third-party deprecations stay warnings.
filterwarnings = [
    "error::DeprecationWarning:app",
    "error::DeprecationWarning:services",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
